services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    env_file: .env
    volumes:
      - wp-db:/var/lib/mysql

    networks:
      - inception
    restart: on-failure

  wordpress:
    # WordPress → MariaDB via mariadb:3306
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    env_file: .env
    volumes:
      - wp-files:/var/www/html

    networks:
      - inception
    restart: on-failure
    depends_on:
      - mariadb

volumes:
  wp-db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/db

  wp-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress

  nginx:
    # NGINX → WordPress via wordpress:9000
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    env_file: .env
    ports:
      - "443:443"
    volumes:
      - wp-files:/var/www/html

    networks:
      - inception
    restart: on-failure
    depends_on:
      - wordpress



networks:
  inception:
    driver: bridge

# Browser → NGINX (443) → WordPress+php-fpm (9000) → MariaDB (3306)