# Run as www-data user
user www-data;

# One worker process per CPU core
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Standard MIME types so browsers handle files correctly
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        # Listen on 443 with SSL — this is the ONLY port
        listen      443 ssl;
        listen      [::]:443 ssl;

        # Must match your domain from .env
        server_name ${DOMAIN_NAME};

        # TLS certificate files generated by init.sh
        ssl_certificate     /etc/nginx/ssl/inception.crt;
        ssl_certificate_key /etc/nginx/ssl/inception.key;

        # THE KEY REQUIREMENT: TLSv1.2 and TLSv1.3 ONLY
        # Older versions (1.0, 1.1) are insecure and forbidden by subject
        ssl_protocols TLSv1.2 TLSv1.3;

        # Where WordPress files live (shared volume with WP container)
        root  /var/www/html;

        # WordPress uses index.php as entry point
        index index.php;

        # Main location block
        location / {
            # Try to serve file directly, then directory,
            # then fall back to WordPress's index.php router
            try_files $uri $uri/ /index.php?$args;
        }

        # Handle all .php files — pass to php-fpm
        location ~ \.php$ {
            # Split path: script filename vs path info
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;

            # This is how NGINX talks to the WordPress container
            # "wordpress" resolves via Docker DNS, port 9000 is php-fpm
            fastcgi_pass wordpress:9000;

            fastcgi_index index.php;

            # Standard FastCGI params — tell php-fpm about the request
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;

            # Tell PHP the actual port the client connected through
            fastcgi_param HTTPS on;

            # fastcgi_param HTTP_HOST tkremnov.42.fr:8443;
            fastcgi_param HTTP_HOST $host;
        }

        # Deny access to .htaccess files (security)
        location ~ /\.ht {
            deny all;
        }
    }
}