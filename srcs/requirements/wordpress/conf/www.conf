[www]
user  = www-data
group = www-data

; Listen on all interfaces on port 9000
; This is how NGINX will connect to us
listen = 0.0.0.0:9000

; Process management — how many PHP workers to spawn
pm                   = dynamic
pm.max_children      = 5
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3